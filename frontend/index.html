<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="InsightLink — painel de desafios e projetos do ENIAC Link+" />
    <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)" />
    <title>InsightLink</title>
    <script>
      // Aplica o tema antes da primeira pintura (evita "flash" claro/escuro).
      (function () {
        try {
          var saved = localStorage.getItem('insightlink_theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
